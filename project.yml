# Optional: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`).
name: Sova
options:
  bundleIdPrefix: app.sova
  deploymentTarget:
    iOS: "26.0"
packages:
  Libraries.dev:
    url: https://github.com/Jakubantalik/Libraries.dev
    revision: 580ac1f0c9858edd579812fdea40d876217b27cb
targets:
  Sova:
    type: application
    platform: iOS
    sources: [Sova, Shared, WatchSync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sova.Sova
        DEVELOPMENT_TEAM: 49BZ7S974W
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sova
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Indigo AppIcon-NightOwl AppIcon-Shades AppIcon-Scholar AppIcon-Party AppIcon-Royal"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Sova.entitlements
        INFOPLIST_FILE: Config/Sova-Info.plist
    dependencies:
      - target: SovaWidgetsExtension
      - target: SovaWatch
      - package: Libraries.dev
        product: DistortionWavesKit
  SovaWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SovaWidgets
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sova.Sova.Widgets
        DEVELOPMENT_TEAM: 49BZ7S974W
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SovaWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Sova
        CODE_SIGN_ENTITLEMENTS: Config/SovaWidgets.entitlements
  SovaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [SovaWatch, WatchShared, WatchSync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sova.Sova.watchkitapp
        DEVELOPMENT_TEAM: 49BZ7S974W
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sova
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.sova.Sova
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/SovaWatch.entitlements
    dependencies:
      - target: SovaWatchWidgetsExtension
  SovaWatchWidgetsExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: SovaWatchWidgets
        excludes: [Info.plist]
      - WatchShared
      - WatchSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sova.Sova.watchkitapp.Widgets
        DEVELOPMENT_TEAM: 49BZ7S974W
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SovaWatchWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Sova
        CODE_SIGN_ENTITLEMENTS: Config/SovaWatchWidgets.entitlements
