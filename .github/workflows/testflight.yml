name: TestFlight

# Builds Sova, signs it in the cloud with an App Store Connect API key, and
# uploads it to App Store Connect. No Mac, certificates or profiles needed.
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1.
# Setup steps: marketing/app-store/CLOUD-BUILD.md
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Build numbers must always go up; start well above any manual upload.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v. See marketing/app-store/CLOUD-BUILD.md"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::Missing secret ASC_KEY_P8"; exit 1; fi

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Get the Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Write the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          sed "s/__TEAM_ID__/$TEAM_ID/" Config/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Sova.xcodeproj \
            -scheme Sova \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sova.xcarchive" \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Sign and upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sova.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
          echo "### Uploaded Sova build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "It shows up in App Store Connect → TestFlight after Apple finishes processing (usually 10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
